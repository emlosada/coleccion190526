<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 RETRO VAULT — Mi Colección</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--bg2:#0f0f1a;--panel:#12121f;--panel2:#1a1a2e;--border:#2a2a4a;--accent:#00ff9d;--accent2:#ff6b35;--accent3:#7c3aed;--accent4:#fbbf24;--text:#e0e0ff;--text-dim:#6060a0;--juego:#00d4ff;--consola:#ff6b35;--libro:#a78bfa;--otro:#34d399}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'VT323',monospace;font-size:18px;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0,rgba(0,0,0,.15) 1px,transparent 1px,transparent 3px);pointer-events:none;z-index:9999;opacity:.4}
body::after{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background-image:radial-gradient(ellipse at 20% 50%,rgba(124,58,237,.08) 0,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(0,255,157,.06) 0,transparent 40%),radial-gradient(ellipse at 60% 80%,rgba(255,107,53,.06) 0,transparent 40%);pointer-events:none;z-index:0}
.header{position:relative;text-align:center;padding:30px 20px 20px;border-bottom:4px solid var(--accent);box-shadow:0 4px 30px rgba(0,255,157,.2);background:linear-gradient(180deg,rgba(0,255,157,.04) 0,transparent 100%)}
.header-logo{font-family:'Press Start 2P',monospace;font-size:clamp(14px,4vw,28px);color:var(--accent);text-shadow:0 0 10px var(--accent),0 0 20px var(--accent),4px 4px 0 rgba(0,100,60,.8);letter-spacing:2px;animation:glitch 4s infinite;line-height:1.6}
.header-logo span{color:var(--accent2);text-shadow:0 0 10px var(--accent2),4px 4px 0 rgba(100,30,0,.8)}
.header-sub{font-family:'VT323',monospace;font-size:22px;color:var(--text-dim);margin-top:8px;letter-spacing:3px}
.pixel-coins{position:absolute;top:15px;right:20px;font-size:28px;animation:bounce 1s infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes glitch{0%,90%,100%{transform:translate(0);filter:none}92%{transform:translate(-2px,0);filter:hue-rotate(90deg)}94%{transform:translate(2px,0);filter:hue-rotate(-90deg)}96%{transform:translate(0,-2px)}}
.pixel-border-h{height:4px;background:repeating-linear-gradient(90deg,var(--accent) 0,var(--accent) 8px,transparent 8px,transparent 16px);opacity:.4}
.stats-bar{display:flex;flex-wrap:wrap;gap:12px;padding:18px 24px;background:var(--panel);border-bottom:2px solid var(--border);align-items:center;justify-content:center}
.stat-chip{display:flex;align-items:center;gap:8px;padding:6px 14px;border:2px solid;font-family:'Press Start 2P',monospace;font-size:9px;position:relative;cursor:default;transition:transform .1s}
.stat-chip:hover{transform:scale(1.05)}
.stat-chip::after{content:'';position:absolute;bottom:-4px;right:-4px;width:100%;height:100%;border:inherit;opacity:.3;z-index:-1}
.stat-chip.total{border-color:var(--accent);color:var(--accent)}.stat-chip.juegos{border-color:var(--juego);color:var(--juego)}.stat-chip.consolas{border-color:var(--consola);color:var(--consola)}.stat-chip.libros{border-color:var(--libro);color:var(--libro)}.stat-chip.otros{border-color:var(--otro);color:var(--otro)}
.charts-section{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;padding:20px 24px;background:var(--bg2);border-bottom:2px solid var(--border)}
.chart-box{background:var(--panel);border:2px solid var(--border);padding:16px;position:relative}
.chart-title{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--accent4);margin-bottom:14px;letter-spacing:1px}
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:120px 1fr 40px;align-items:center;gap:8px;font-size:16px}
.bar-label{color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:14px;background:rgba(255,255,255,.05);border:1px solid var(--border);position:relative;overflow:hidden}
.bar-fill{height:100%;position:relative;transition:width 1s ease}
.bar-fill::after{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.25)}
.bar-count{color:var(--accent);text-align:right;font-size:20px}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut-legend{display:flex;flex-direction:column;gap:8px;font-size:15px}
.legend-item{display:flex;align-items:center;gap:8px}
.legend-dot{width:12px;height:12px;border:2px solid;flex-shrink:0}
.controls{display:flex;flex-wrap:wrap;gap:12px;padding:16px 24px;background:var(--panel);border-bottom:2px solid var(--border);align-items:center}
.search-wrap{position:relative;flex:1;min-width:220px}
.search-wrap::before{content:'▶';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:16px;pointer-events:none}
input[type=text]{width:100%;background:var(--bg);border:2px solid var(--accent);color:var(--accent);font-family:'VT323',monospace;font-size:20px;padding:8px 14px 8px 36px;outline:none;caret-color:var(--accent);box-shadow:inset 0 0 12px rgba(0,255,157,.1),0 0 8px rgba(0,255,157,.15)}
input[type=text]::placeholder{color:var(--text-dim)}
input[type=text]:focus{box-shadow:inset 0 0 12px rgba(0,255,157,.15),0 0 16px rgba(0,255,157,.3)}
.filter-btn{background:var(--bg);border:2px solid var(--border);color:var(--text-dim);font-family:'Press Start 2P',monospace;font-size:8px;padding:10px 14px;cursor:pointer;transition:all .1s;position:relative}
.filter-btn::after{content:'';position:absolute;bottom:-3px;right:-3px;width:100%;height:100%;border:2px solid var(--border);z-index:-1;opacity:.4}
.filter-btn:hover,.filter-btn.active{background:var(--panel2)}
.filter-btn.active.all{border-color:var(--accent);color:var(--accent)}.filter-btn.active.juego{border-color:var(--juego);color:var(--juego)}.filter-btn.active.Consola{border-color:var(--consola);color:var(--consola)}.filter-btn.active.Libro{border-color:var(--libro);color:var(--libro)}.filter-btn.active.otro{border-color:var(--otro);color:var(--otro)}
select{background:var(--bg);border:2px solid var(--border);color:var(--text-dim);font-family:'VT323',monospace;font-size:18px;padding:8px 12px;outline:none;cursor:pointer}
.results-info{padding:8px 24px;font-size:16px;color:var(--text-dim);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.results-info strong{color:var(--accent)}
.grid-container{padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--panel);border:2px solid var(--border);position:relative;cursor:pointer;transition:transform .1s,box-shadow .1s;overflow:hidden}
.card::after{content:'';position:absolute;bottom:-4px;right:-4px;width:100%;height:100%;border:2px solid var(--border);z-index:-1;transition:inherit}
.card:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--border)}
.card:hover::after{bottom:-6px;right:-6px}
.card-tipo-bar{height:4px;width:100%}
.card-tipo-bar.juego{background:var(--juego)}.card-tipo-bar.Consola{background:var(--consola)}.card-tipo-bar.Libro{background:var(--libro)}.card-tipo-bar.otro{background:var(--otro)}
.card-body{padding:14px 14px 10px}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.card-name{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--text);line-height:1.6;flex:1}
.card-badge{font-family:'Press Start 2P',monospace;font-size:7px;padding:3px 6px;border:1px solid;white-space:nowrap;flex-shrink:0}
.card-badge.juego{border-color:var(--juego);color:var(--juego)}.card-badge.Consola{border-color:var(--consola);color:var(--consola)}.card-badge.Libro{border-color:var(--libro);color:var(--libro)}.card-badge.otro{border-color:var(--otro);color:var(--otro)}
.card-meta{font-size:15px;color:var(--text-dim);margin-bottom:4px}
.card-meta span{color:var(--text)}
.card-links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.link-btn{font-family:'Press Start 2P',monospace;font-size:7px;padding:5px 8px;border:1px solid;text-decoration:none;cursor:pointer;background:transparent;display:inline-flex;align-items:center;gap:4px;transition:background .1s}
.link-btn:hover{background:rgba(255,255,255,.08)}
.link-btn.wiki{border-color:var(--text-dim);color:var(--text-dim)}.link-btn.yt{border-color:#ff4444;color:#ff4444}.link-btn.price{border-color:var(--accent4);color:var(--accent4)}.link-btn.lore{border-color:var(--accent3);color:var(--accent3)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--panel);border:3px solid var(--accent3);max-width:680px;width:100%;max-height:85vh;overflow-y:auto;position:relative;box-shadow:6px 6px 0 rgba(124,58,237,.5),0 0 40px rgba(124,58,237,.2);animation:modal-in .15s ease}
@keyframes modal-in{from{transform:scale(.95) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-tipo-bar{height:5px;width:100%}
.modal-header{padding:20px 20px 14px;border-bottom:2px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start}
.modal-title{font-family:'Press Start 2P',monospace;font-size:clamp(9px,2vw,13px);color:var(--text);line-height:1.7;max-width:80%}
.modal-close{background:none;border:2px solid var(--border);color:var(--text);font-family:'Press Start 2P',monospace;font-size:10px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .1s,border-color .1s}
.modal-close:hover{background:rgba(255,0,0,.2);border-color:#ff4444;color:#ff4444}
.modal-body{padding:20px}
.modal-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.info-block{background:var(--bg2);border:1px solid var(--border);padding:10px 12px}
.info-block-label{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--text-dim);margin-bottom:4px}
.info-block-value{font-size:20px;color:var(--text)}
.modal-links{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.modal-link-btn{font-family:'Press Start 2P',monospace;font-size:8px;padding:8px 14px;border:2px solid;text-decoration:none;cursor:pointer;background:transparent;display:inline-flex;align-items:center;gap:6px;transition:background .1s,transform .1s;position:relative}
.modal-link-btn::after{content:'';position:absolute;bottom:-3px;right:-3px;width:100%;height:100%;border:inherit;opacity:.3;z-index:-1}
.modal-link-btn:hover{background:rgba(255,255,255,.06);transform:translate(-1px,-1px)}
.modal-link-btn.wiki{border-color:#888;color:#aaa}.modal-link-btn.yt{border-color:#ff4444;color:#ff4444}.modal-link-btn.price{border-color:var(--accent4);color:var(--accent4)}
.lore-section{background:var(--bg2);border:2px solid var(--accent3);padding:24px 16px 16px;position:relative}
.lore-section::before{content:'◆ FICHA DE LORE ◆';font-family:'Press Start 2P',monospace;font-size:8px;color:var(--accent3);position:absolute;top:-10px;left:12px;background:var(--panel);padding:0 8px}
.lore-content{font-size:18px;color:var(--text);line-height:1.8;white-space:pre-wrap}
.lore-line-key{color:var(--accent4);font-size:17px}
.lore-line-val{color:var(--text)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);font-size:22px;grid-column:1/-1}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.empty-state p{font-family:'Press Start 2P',monospace;font-size:10px;margin-top:10px}
.footer{text-align:center;padding:20px;border-top:2px solid var(--border);color:var(--text-dim);font-size:15px;margin-top:20px}
.footer span{color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border:1px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:var(--accent3)}
@media(max-width:600px){.modal-info-grid{grid-template-columns:1fr}.header-logo{font-size:12px}.charts-section{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
  <div class="pixel-coins">🎮 👾 🕹️</div>
  <div class="header-logo">🎮 RETRO <span>VAULT</span></div>
  <div class="header-sub">▸ MI COLECCIÓN DE COLECCIONABLES ◂</div>
  <div class="pixel-border-h" style="margin-top:14px"></div>
</header>
<div class="stats-bar" id="statsBar"></div>
<div class="charts-section">
  <div class="chart-box"><div class="chart-title">▶ DISTRIBUCIÓN POR TIPO</div><div class="donut-wrap"><svg id="donutChart" width="110" height="110" viewBox="0 0 110 110"></svg><div class="donut-legend" id="donutLegend"></div></div></div>
  <div class="chart-box"><div class="chart-title">▶ TOP PLATAFORMAS (JUEGOS)</div><div class="bar-chart" id="platformChart"></div></div>
  <div class="chart-box"><div class="chart-title">▶ EDITORIALES (LIBROS)</div><div class="bar-chart" id="editorialChart"></div></div>
  <div class="chart-box"><div class="chart-title">▶ DISTRIBUCIÓN METACRITIC</div><div class="bar-chart" id="metacriticChart"></div></div>
</div>
<div class="controls">
  <div class="search-wrap"><input type="text" id="searchInput" placeholder="BUSCAR COLECCIONABLE..." autocomplete="off"></div>
  <button class="filter-btn active all" data-filter="all" onclick="setFilter('all')">TODOS</button>
  <button class="filter-btn juego" data-filter="juego" onclick="setFilter('juego')">🕹 JUEGOS</button>
  <button class="filter-btn Consola" data-filter="Consola" onclick="setFilter('Consola')">📺 CONSOLAS</button>
  <button class="filter-btn Libro" data-filter="Libro" onclick="setFilter('Libro')">📚 LIBROS</button>
  <button class="filter-btn otro" data-filter="otro" onclick="setFilter('otro')">📦 OTROS</button>
  <select id="platformFilter" onchange="render()"><option value="">TODAS LAS PLATAFORMAS</option></select>
  <select id="yearFilter" onchange="render()"><option value="">TODOS LOS AÑOS</option></select>
  <select id="scoreFilter" onchange="render()"><option value="">TODAS LAS NOTAS</option><option value="10">⭐ 10</option><option value="9">⭐ 9</option><option value="8">⭐ 8</option><option value="7">⭐ 7</option><option value="6">⭐ 6</option><option value="5">⭐ 5</option></select>
</div>
<div class="results-info" id="resultsInfo"></div>
<div class="grid-container" id="gridContainer"></div>
<footer class="footer"><span>RETRO VAULT</span> — Colección personal &nbsp;|&nbsp; 306 coleccionables &nbsp;|&nbsp; <span>INSERT COIN TO CONTINUE</span></footer>
<div class="modal-overlay" id="modalOverlay" onclick="closeModalBg(event)">
  <div class="modal" id="modal">
    <div class="modal-tipo-bar" id="modalTipoBar"></div>
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModalBtn()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-image-wrap" id="modalImageWrap">
        <img id="modalImage" src="" alt="" style="display:none;width:100%;max-height:200px;object-fit:cover;border:2px solid var(--border);margin-bottom:16px;image-rendering:auto">
      </div>
      <div class="modal-info-grid" id="modalInfoGrid"></div>
      <div class="modal-links" id="modalLinks"></div>
      <div class="lore-section"><div class="lore-content" id="loreContent"></div></div>
    </div>
  </div>
</div>
<script>
const COLLECTION = [{"nombre": "Ratchet & Clank: Size matters", "tipo": "juego", "plataforma": "psp", "editorial": "", "lore": "AÑO: 2007\nDESARROLLADOR: High Impact Games\nGÉNERO: Plataformas / Acción\nCURIOSIDAD 1: Fue el primer Ratchet & Clank desarrollado por un estudio externo a Insomniac Games.\nCURIOSIDAD 2: El juego usa el sistema de ad-hoc multiplayer de PSP con hasta 4 jugadores.\nRESUMEN: Aventura de plataformas portátil donde Ratchet y Clank van a un planeta de vacaciones y se meten en problemas con un ejército de robots. Una de las entregas más sólidas de la PSP.", "tipoKey": "juego", "anio": 2007, "metacritic": 79}, {"nombre": "Patapon 2", "tipo": "juego", "plataforma": "psp", "editorial": "", "lore": "AÑO: 2008\nDESARROLLADOR: Pyramid / SCE Japan Studio\nGÉNERO: Rhythm / Estrategia\nCURIOSIDAD 1: En Japón se lanzó solo en descarga digital para PSP, siendo de los primeros juegos AAA en ese formato.\nCURIOSIDAD 2: El sistema de \"fever\" rítmico fue elogiado como uno de los más originales de la generación.\nRESUMEN: Secuela del singular juego de ritmo donde comandás tribus de ojos gigantes al ritmo del tambor. Expandió el primer juego con nuevas unidades y una campaña más larga.", "tipoKey": "juego", "anio": 2008, "metacritic": 87}, {"nombre": "Sega Genesis Collection", "tipo": "juego", "plataforma": "psp", "editorial": "", "lore": "AÑO: 2006\nDESARROLLADOR: Backbone Entertainment / Sega\nGÉNERO: Compilación retro\nCURIOSIDAD 1: Incluye 28 clásicos de Genesis incluyendo Sonic, Phantasy Star y Golden Axe.\nCURIOSIDAD 2: La versión PSP agrega minijuegos de arcade de Sega como Space Harrier.\nRESUMEN: Compilación de oro para fans de Sega que lleva los mejores clásicos de la Genesis a la palma de la mano. Un valor increíble para coleccionistas.", "tipoKey": "juego", "anio": 2006, "metacritic": 80}, {"nombre": "Grand theft auto chinatown wars", "tipo": "juego", "plataforma": "psp", "editorial": "", "lore": "AÑO: 2009\nDESARROLLADOR: Rockstar Leeds\nGÉNERO: A let currentFilter='all', currentSearch='', currentPlatform='', currentYear='', currentScore='';

function tipoEmoji(t){return t==='juego'?'🕹':t==='Consola'?'📺':t==='Libro'?'📚':'📦'}
function wikiUrl(n){return 'https://es.wikipedia.org/wiki/Special:Search?search='+encodeURIComponent(n)}
function wikiEnUrl(n){return 'https://en.wikipedia.org/wiki/Special:Search?search='+encodeURIComponent(n)}
function ytUrl(n){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(n+' review')}
function priceUrl(n){return 'https://www.pricecharting.com/search-products?q='+encodeURIComponent(n)+'&type=videogame'}

function buildStats(){
  const total=COLLECTION.length;
  const j=COLLECTION.filter(i=>i.tipoKey==='juego').length;
  const c=COLLECTION.filter(i=>i.tipoKey==='Consola').length;
  const l=COLLECTION.filter(i=>i.tipoKey==='Libro').length;
  const o=COLLECTION.filter(i=>i.tipoKey==='otro').length;
  document.getElementById('statsBar').innerHTML=`
    <div class="stat-chip total">🎮 TOTAL: ${total}</div>
    <div class="stat-chip juegos">🕹 JUEGOS: ${j} (${Math.round(j/total*100)}%)</div>
    <div class="stat-chip consolas">📺 CONSOLAS: ${c} (${Math.round(c/total*100)}%)</div>
    <div class="stat-chip libros">📚 LIBROS: ${l} (${Math.round(l/total*100)}%)</div>
    <div class="stat-chip otros">📦 OTROS: ${o} (${Math.round(o/total*100)}%)</div>`;
}

function buildDonut(){
  const counts={juego:0,Consola:0,Libro:0,otro:0};
  COLLECTION.forEach(i=>counts[i.tipoKey]++);
  const total=COLLECTION.length;
  const colors={juego:'#00d4ff',Consola:'#ff6b35',Libro:'#a78bfa',otro:'#34d399'};
  const labels={juego:'JUEGOS',Consola:'CONSOLAS',Libro:'LIBROS',otro:'OTROS'};
  const svg=document.getElementById('donutChart');
  const legend=document.getElementById('donutLegend');
  const cx=55,cy=55,r=40;
  let startAngle=-Math.PI/2,paths='',legendHtml='';
  Object.entries(counts).forEach(([key,val])=>{
    if(!val)return;
    const angle=(val/total)*Math.PI*2,endAngle=startAngle+angle;
    const x1=cx+r*Math.cos(startAngle),y1=cy+r*Math.sin(startAngle);
    const x2=cx+r*Math.cos(endAngle),y2=cy+r*Math.sin(endAngle);
    const large=angle>Math.PI?1:0;
    paths+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${colors[key]}" opacity="0.85"/>`;
    legendHtml+=`<div class="legend-item"><div class="legend-dot" style="border-color:${colors[key]};background:${colors[key]}22"></div><span style="color:${colors[key]}">${labels[key]} ${val}</span></div>`;
    startAngle=endAngle;
  });
  svg.innerHTML=paths+`<circle cx="${cx}" cy="${cy}" r="22" fill="#12121f"/>`;
  legend.innerHTML=legendHtml;
}

function buildPlatformChart(){
  const pc={};
  COLLECTION.filter(i=>i.tipoKey==='juego'&&i.plataforma).forEach(i=>{const p=i.plataforma.trim();pc[p]=(pc[p]||0)+1;});
  const sorted=Object.entries(pc).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=sorted[0][1];
  const colors=['#00d4ff','#7c3aed','#ff6b35','#00ff9d','#fbbf24','#f472b6','#34d399','#60a5fa'];
  document.getElementById('platformChart').innerHTML=sorted.map(([p,cnt],i)=>`
    <div class="bar-row"><div class="bar-label">${p}</div><div class="bar-track"><div class="bar-fill" style="width:${cnt/max*100}%;background:${colors[i%colors.length]}"></div></div><div class="bar-count">${cnt}</div></div>`).join('');
}

function buildEditorialChart(){
  const ec={};
  COLLECTION.filter(i=>i.editorial).forEach(i=>{ec[i.editorial]=(ec[i.editorial]||0)+1;});
  const sorted=Object.entries(ec).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=sorted[0]?.[1]||1;
  const colors=['#a78bfa','#f472b6','#60a5fa','#34d399','#fbbf24','#ff6b35','#00d4ff','#7c3aed'];
  document.getElementById('editorialChart').innerHTML=sorted.map(([ed,cnt],i)=>`
    <div class="bar-row"><div class="bar-label">${ed}</div><div class="bar-track"><div class="bar-fill" style="width:${cnt/max*100}%;background:${colors[i%colors.length]}"></div></div><div class="bar-count">${cnt}</div></div>`).join('');
}

function buildMetacriticChart(){
  const dist={5:0,6:0,7:0,8:0,9:0,10:0};
  COLLECTION.filter(i=>i.metacritic).forEach(i=>{
    const b=Math.round(i.metacritic/10);
    if(dist[b]!==undefined) dist[b]++;
  });
  const max=Math.max(...Object.values(dist));
  const colors={'5':'#ff4444','6':'#ff6b35','7':'#fbbf24','8':'#00d4ff','9':'#00ff9d','10':'#a78bfa'};
  const labels={'5':'50-59','6':'60-69','7':'70-79','8':'80-89','9':'90-94','10':'95+'};
  document.getElementById('metacriticChart').innerHTML=Object.entries(dist).map(([score,cnt])=>`
    <div class="bar-row">
      <div class="bar-label" style="color:${colors[score]}">⭐${score} (${labels[score]})</div>
      <div class="bar-track"><div class="bar-fill" style="width:${max?cnt/max*100:0}%;background:${colors[score]}"></div></div>
      <div class="bar-count">${cnt}</div>
    </div>`).join('');
}
function buildYearOptions(){
  const years=[...new Set(COLLECTION.map(i=>i.anio).filter(Boolean))].sort((a,b)=>a-b);
  const sel=document.getElementById('yearFilter');
  years.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y;sel.appendChild(o);});
}
function buildPlatformOptions(){
  const plats=[...new Set(COLLECTION.filter(i=>i.plataforma).map(i=>i.plataforma.trim()))].sort();
  const sel=document.getElementById('platformFilter');
  plats.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o);});
}

function setFilter(f){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>{b.classList.remove('active');if(b.dataset.filter===f)b.classList.add('active');});
  render();
}

function getFiltered(){
  return COLLECTION.filter(item=>{
    const q=currentSearch.toLowerCase();
    const ms=!q||item.nombre.toLowerCase().includes(q)||(item.plataforma||'').toLowerCase().includes(q)||(item.editorial||'').toLowerCase().includes(q);
    const mf=currentFilter==='all'||item.tipoKey===currentFilter;
    const mp=!currentPlatform||item.plataforma===currentPlatform;
    const my=!currentYear||item.anio===parseInt(currentYear);
    const msc=!currentScore||Math.round((item.metacritic||0)/10)===parseInt(currentScore);
    return ms&&mf&&mp&&my&&msc;
  });
}

function formatLore(lore){
  if(!lore)return '<span style="color:var(--text-dim)">Sin datos disponibles.</span>';
  return lore.split('\n').map(line=>{
    const col=line.indexOf(':');
    if(col>0&&col<20){
      const key=line.slice(0,col+1);
      const val=line.slice(col+1);
      return `<span class="lore-line-key">${key}</span><span class="lore-line-val">${val}</span>`;
    }
    return line;
  }).join('\n');
}

function render(){
  const filtered=getFiltered();
  document.getElementById('resultsInfo').innerHTML=`<span>Mostrando <strong>${filtered.length}</strong> de ${COLLECTION.length} items</span>`;
  const grid=document.getElementById('gridContainer');
  if(!filtered.length){grid.innerHTML='<div class="empty-state"><div class="icon">👾</div><p>GAME OVER — NO HAY RESULTADOS</p></div>';return;}
  grid.innerHTML=filtered.map(item=>{
    const plat=item.plataforma?`<div class="card-meta">📺 <span>${item.plataforma}</span></div>`:'';
    const ed=item.editorial?`<div class="card-meta">📖 <span>${item.editorial}</span></div>`:'';
    const anioTag=item.anio?`<div class="card-meta">📅 <span>${item.anio}</span></div>`:'';
    const metaScore=item.metacritic?Math.round(item.metacritic/10):null;
    const metaColor=metaScore>=9?'#00ff9d':metaScore>=8?'#00d4ff':metaScore>=7?'#fbbf24':metaScore>=6?'#ff6b35':'#ff4444';
    const metaTag=item.metacritic?`<div class="card-meta">🎯 META: <span style="color:${metaColor};font-weight:bold">${item.metacritic} <small>(${metaScore}/10)</small></span></div>`:'';
    const price=(item.tipoKey==='juego'||item.tipoKey==='Consola')?`<a class="link-btn price" href="${priceUrl(item.nombre)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">💰 PRECIO</a>`:'';
    const idx=COLLECTION.indexOf(item);
    return `<div class="card" data-idx="${idx}" onclick="openModalIdx(${idx})">
      <div class="card-tipo-bar ${item.tipoKey}"></div>
      <div class="card-body">
        <div class="card-header">
          <div class="card-name">${item.nombre}</div>
          <div class="card-badge ${item.tipoKey}">${tipoEmoji(item.tipoKey)} ${item.tipo||'OTRO'}</div>
        </div>
        ${plat}${ed}${anioTag}${metaTag}
        <div class="card-links">
          <a class="link-btn wiki" href="${wikiUrl(item.nombre)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📖 WIKI</a>
          <a class="link-btn yt" href="${ytUrl(item.nombre)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">▶ YT</a>
          ${price}
          <button class="link-btn lore" onclick="event.stopPropagation();openModalIdx(${idx})">✦ LORE</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openModalIdx(idx){
  openModal(COLLECTION[idx].nombre);
}
function openModal(nombre){
  const item=COLLECTION.find(i=>i.nombre===nombre);
  if(!item)return;
  const tipoColors={juego:'#00d4ff',Consola:'#ff6b35',Libro:'#a78bfa',otro:'#34d399'};
  document.getElementById('modalTipoBar').style.background=tipoColors[item.tipoKey]||'#888';
  document.getElementById('modalTitle').textContent=item.nombre;
  const infoItems=[
    {label:'TIPO',value:`${tipoEmoji(item.tipoKey)} ${item.tipo||'OTRO'}`},
    {label:'AÑO',value:item.anio?String(item.anio):'—'},
    {label:'METACRITIC',value:item.metacritic?`${item.metacritic}/100 (${Math.round(item.metacritic/10)}/10)`:'—'},
    {label:'PLATAFORMA',value:item.plataforma||'—'},
    {label:'EDITORIAL',value:item.editorial||'—'},
  ];
  // RAWG image
  const imgEl=document.getElementById('modalImage');
  imgEl.style.display='none'; imgEl.src='';
  if(item.tipoKey==='juego'||item.tipoKey==='Consola'){
    const q=encodeURIComponent(item.nombre);
    fetch(`https://api.rawg.io/api/games?search=${q}&key=demo&page_size=1`)
      .then(r=>r.json()).then(d=>{
        if(d.results&&d.results[0]&&d.results[0].background_image){
          imgEl.src=d.results[0].background_image;
          imgEl.style.display='block';
        }
      }).catch(()=>{});
  }
  document.getElementById('modalInfoGrid').innerHTML=infoItems.map(i=>`<div class="info-block"><div class="info-block-label">${i.label}</div><div class="info-block-value">${i.value}</div></div>`).join('');
  const price=(item.tipoKey==='juego'||item.tipoKey==='Consola')?`<a class="modal-link-btn price" href="${priceUrl(item.nombre)}" target="_blank" rel="noopener">💰 PRICECHARTING</a>`:'';
  document.getElementById('modalLinks').innerHTML=`
    <a class="modal-link-btn wiki" href="${wikiUrl(item.nombre)}" target="_blank" rel="noopener">📖 WIKIPEDIA ES</a>
    <a class="modal-link-btn wiki" href="${wikiEnUrl(item.nombre)}" target="_blank" rel="noopener">📖 WIKIPEDIA EN</a>
    <a class="modal-link-btn yt" href="${ytUrl(item.nombre)}" target="_blank" rel="noopener">▶ YOUTUBE</a>
    ${price}`;
  document.getElementById('loreContent').innerHTML=formatLore(item.lore);
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModalBg(e){if(e.target===document.getElementById('modalOverlay'))closeModalBtn();}
function closeModalBtn(){document.getElementById('modalOverlay').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModalBtn();});

buildStats();buildDonut();buildPlatformChart();buildEditorialChart();buildPlatformOptions();buildYearOptions();buildMetacriticChart();

document.getElementById('searchInput').addEventListener('input',e=>{currentSearch=e.target.value;render();});
document.getElementById('platformFilter').addEventListener('change',e=>{currentPlatform=e.target.value;render();});
document.getElementById('yearFilter').addEventListener('change',e=>{currentYear=e.target.value;render();});
document.getElementById('scoreFilter').addEventListener('change',e=>{currentScore=e.target.value;render();});

render();
</script>
