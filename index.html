<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 RETRO VAULT — Mi Colección</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #0f0f1a;
    --panel: #12121f;
    --panel2: #1a1a2e;
    --border: #2a2a4a;
    --accent: #00ff9d;
    --accent2: #ff6b35;
    --accent3: #7c3aed;
    --accent4: #fbbf24;
    --text: #e0e0ff;
    --text-dim: #6060a0;
    --juego: #00d4ff;
    --consola: #ff6b35;
    --libro: #a78bfa;
    --otro: #34d399;
    --scanline: rgba(0,0,0,0.15);
    --pixel: 2px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'VT323', monospace;
    font-size: 18px;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* CRT scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      var(--scanline) 0px,
      var(--scanline) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  /* Pixel grid background */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(124,58,237,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(0,255,157,0.06) 0%, transparent 40%),
      radial-gradient(ellipse at 60% 80%, rgba(255,107,53,0.06) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== HEADER ===== */
  .header {
    position: relative;
    text-align: center;
    padding: 30px 20px 20px;
    border-bottom: 4px solid var(--accent);
    box-shadow: 0 4px 30px rgba(0,255,157,0.2);
    background: linear-gradient(180deg, rgba(0,255,157,0.04) 0%, transparent 100%);
  }

  .header-logo {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 4vw, 28px);
    color: var(--accent);
    text-shadow:
      0 0 10px var(--accent),
      0 0 20px var(--accent),
      4px 4px 0 rgba(0,100,60,0.8);
    letter-spacing: 2px;
    animation: glitch 4s infinite;
    line-height: 1.6;
  }

  .header-logo span {
    color: var(--accent2);
    text-shadow:
      0 0 10px var(--accent2),
      4px 4px 0 rgba(100,30,0,0.8);
  }

  .header-sub {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--text-dim);
    margin-top: 8px;
    letter-spacing: 3px;
  }

  .pixel-coins {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 28px;
    animation: bounce 1s infinite alternate;
  }

  @keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-6px); }
  }

  @keyframes glitch {
    0%, 90%, 100% { transform: translate(0); filter: none; }
    92% { transform: translate(-2px, 0); filter: hue-rotate(90deg); }
    94% { transform: translate(2px, 0); filter: hue-rotate(-90deg); }
    96% { transform: translate(0, -2px); }
  }

  /* ===== STATS BAR ===== */
  .stats-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 18px 24px;
    background: var(--panel);
    border-bottom: 2px solid var(--border);
    align-items: center;
    justify-content: center;
  }

  .stat-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border: 2px solid;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    position: relative;
    cursor: default;
    transition: transform 0.1s;
  }
  .stat-chip:hover { transform: scale(1.05); }
  .stat-chip::after {
    content: '';
    position: absolute;
    bottom: -4px; right: -4px;
    width: 100%; height: 100%;
    border: inherit;
    opacity: 0.3;
    z-index: -1;
  }
  .stat-chip.total { border-color: var(--accent); color: var(--accent); }
  .stat-chip.juegos { border-color: var(--juego); color: var(--juego); }
  .stat-chip.consolas { border-color: var(--consola); color: var(--consola); }
  .stat-chip.libros { border-color: var(--libro); color: var(--libro); }
  .stat-chip.otros { border-color: var(--otro); color: var(--otro); }

  /* ===== CHARTS ROW ===== */
  .charts-section {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    padding: 20px 24px;
    background: var(--bg2);
    border-bottom: 2px solid var(--border);
  }

  .chart-box {
    background: var(--panel);
    border: 2px solid var(--border);
    padding: 16px;
    position: relative;
  }
  .chart-box::before {
    content: '';
    position: absolute;
    top: -2px; left: -2px;
    right: 2px; bottom: 2px;
    border: 2px solid rgba(255,255,255,0.05);
    pointer-events: none;
  }

  .chart-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--accent4);
    margin-bottom: 14px;
    letter-spacing: 1px;
  }

  .bar-chart { display: flex; flex-direction: column; gap: 8px; }
  .bar-row {
    display: grid;
    grid-template-columns: 120px 1fr 40px;
    align-items: center;
    gap: 8px;
    font-size: 16px;
  }
  .bar-label { color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track {
    height: 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    position: relative;
    transition: width 1s ease;
    image-rendering: pixelated;
  }
  .bar-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: rgba(255,255,255,0.25);
  }
  .bar-count { color: var(--accent); text-align: right; font-size: 20px; }

  /* Donut chart via SVG */
  .donut-wrap { display: flex; align-items: center; gap: 20px; }
  .donut-legend { display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-dot { width: 12px; height: 12px; border: 2px solid; flex-shrink: 0; image-rendering: pixelated; }

  /* ===== CONTROLS ===== */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 2px solid var(--border);
    align-items: center;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 220px;
  }
  .search-wrap::before {
    content: '▶';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
    font-size: 16px;
    pointer-events: none;
  }
  input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 2px solid var(--accent);
    color: var(--accent);
    font-family: 'VT323', monospace;
    font-size: 20px;
    padding: 8px 14px 8px 36px;
    outline: none;
    caret-color: var(--accent);
    box-shadow: inset 0 0 12px rgba(0,255,157,0.1), 0 0 8px rgba(0,255,157,0.15);
  }
  input[type="text"]::placeholder { color: var(--text-dim); }
  input[type="text"]:focus { box-shadow: inset 0 0 12px rgba(0,255,157,0.15), 0 0 16px rgba(0,255,157,0.3); }

  .filter-btn {
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--text-dim);
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    padding: 10px 14px;
    cursor: pointer;
    transition: all 0.1s;
    position: relative;
    letter-spacing: 0.5px;
  }
  .filter-btn::after {
    content: '';
    position: absolute;
    bottom: -3px; right: -3px;
    width: 100%; height: 100%;
    border: 2px solid var(--border);
    z-index: -1;
    opacity: 0.4;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--panel2);
  }
  .filter-btn.active.all    { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active.juego  { border-color: var(--juego); color: var(--juego); }
  .filter-btn.active.Consola{ border-color: var(--consola); color: var(--consola); }
  .filter-btn.active.Libro  { border-color: var(--libro); color: var(--libro); }
  .filter-btn.active.otro   { border-color: var(--otro); color: var(--otro); }

  select {
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--text-dim);
    font-family: 'VT323', monospace;
    font-size: 18px;
    padding: 8px 12px;
    outline: none;
    cursor: pointer;
  }

  /* ===== RESULTS INFO ===== */
  .results-info {
    padding: 8px 24px;
    font-size: 16px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .results-info strong { color: var(--accent); }

  /* ===== GRID ===== */
  .grid-container {
    padding: 20px 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  /* ===== CARD ===== */
  .card {
    background: var(--panel);
    border: 2px solid var(--border);
    position: relative;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border: 1px solid rgba(255,255,255,0.04);
    pointer-events: none;
  }
  .card::after {
    content: '';
    position: absolute;
    bottom: -4px; right: -4px;
    width: 100%; height: 100%;
    border: 2px solid var(--border);
    z-index: -1;
    transition: inherit;
  }
  .card:hover {
    transform: translate(-2px, -2px);
    box-shadow: 4px 4px 0 var(--border);
  }
  .card:hover::after {
    bottom: -6px; right: -6px;
  }

  .card-tipo-bar {
    height: 4px;
    width: 100%;
  }
  .card-tipo-bar.juego   { background: var(--juego); }
  .card-tipo-bar.Consola { background: var(--consola); }
  .card-tipo-bar.Libro   { background: var(--libro); }
  .card-tipo-bar.otro    { background: var(--otro); }

  .card-body { padding: 14px 14px 10px; }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
  }

  .card-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--text);
    line-height: 1.6;
    flex: 1;
  }

  .card-badge {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 3px 6px;
    border: 1px solid;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .card-badge.juego   { border-color: var(--juego);   color: var(--juego); }
  .card-badge.Consola { border-color: var(--consola); color: var(--consola); }
  .card-badge.Libro   { border-color: var(--libro);   color: var(--libro); }
  .card-badge.otro    { border-color: var(--otro);    color: var(--otro); }

  .card-meta { font-size: 15px; color: var(--text-dim); margin-bottom: 4px; }
  .card-meta span { color: var(--text); }

  .card-links {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .link-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 5px 8px;
    border: 1px solid;
    text-decoration: none;
    cursor: pointer;
    background: transparent;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background 0.1s;
  }
  .link-btn:hover { background: rgba(255,255,255,0.08); }
  .link-btn.wiki  { border-color: var(--text-dim); color: var(--text-dim); }
  .link-btn.yt    { border-color: #ff4444; color: #ff4444; }
  .link-btn.price { border-color: var(--accent4); color: var(--accent4); }
  .link-btn.lore  { border-color: var(--accent3); color: var(--accent3); }

  /* ===== MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--panel);
    border: 3px solid var(--accent3);
    max-width: 680px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 6px 6px 0 rgba(124,58,237,0.5), 0 0 40px rgba(124,58,237,0.2);
    animation: modal-in 0.15s ease;
  }

  @keyframes modal-in {
    from { transform: scale(0.95) translateY(10px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }

  .modal-tipo-bar {
    height: 5px;
    width: 100%;
  }

  .modal-header {
    padding: 20px 20px 14px;
    border-bottom: 2px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .modal-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(9px, 2vw, 13px);
    color: var(--text);
    line-height: 1.7;
    max-width: 80%;
  }

  .modal-close {
    background: none;
    border: 2px solid var(--border);
    color: var(--text);
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.1s, border-color 0.1s;
  }
  .modal-close:hover { background: rgba(255,0,0,0.2); border-color: #ff4444; color: #ff4444; }

  .modal-body { padding: 20px; }

  .modal-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }

  .info-block {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 10px 12px;
  }
  .info-block-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--text-dim);
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .info-block-value {
    font-size: 20px;
    color: var(--text);
  }

  .modal-links { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }

  .modal-link-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    padding: 8px 14px;
    border: 2px solid;
    text-decoration: none;
    cursor: pointer;
    background: transparent;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.1s, transform 0.1s;
    position: relative;
  }
  .modal-link-btn::after {
    content: '';
    position: absolute;
    bottom: -3px; right: -3px;
    width: 100%; height: 100%;
    border: inherit;
    opacity: 0.3;
    z-index: -1;
  }
  .modal-link-btn:hover { background: rgba(255,255,255,0.06); transform: translate(-1px,-1px); }
  .modal-link-btn.wiki  { border-color: #888; color: #aaa; }
  .modal-link-btn.yt    { border-color: #ff4444; color: #ff4444; }
  .modal-link-btn.price { border-color: var(--accent4); color: var(--accent4); }

  /* Lore section */
  .lore-section {
    background: var(--bg2);
    border: 2px solid var(--accent3);
    padding: 16px;
    position: relative;
  }
  .lore-section::before {
    content: '◆ FICHA DE LORE ◆';
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--accent3);
    position: absolute;
    top: -10px;
    left: 12px;
    background: var(--panel);
    padding: 0 8px;
  }

  .lore-content {
    font-size: 18px;
    color: var(--text);
    line-height: 1.6;
    min-height: 60px;
    white-space: pre-wrap;
  }

  .lore-loading {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--accent3);
    font-size: 18px;
  }
  .lore-loading::before {
    content: '';
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--accent3);
    border-top-color: transparent;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .lore-error { color: #ff6b6b; font-size: 16px; }

  /* ===== PIXEL DECORATIONS ===== */
  .pixel-border-h {
    height: 4px;
    background: repeating-linear-gradient(90deg,
      var(--accent) 0px, var(--accent) 8px,
      transparent 8px, transparent 16px
    );
    opacity: 0.4;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-size: 22px;
    grid-column: 1 / -1;
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-family: 'Press Start 2P', monospace; font-size: 10px; margin-top: 10px; }

  /* Footer */
  .footer {
    text-align: center;
    padding: 20px;
    border-top: 2px solid var(--border);
    color: var(--text-dim);
    font-size: 15px;
    margin-top: 20px;
  }
  .footer span { color: var(--accent); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border: 1px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent3); }

  /* Year badge */
  .year-badge {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--accent4);
    border: 1px solid rgba(251,191,36,0.3);
    padding: 2px 5px;
    margin-top: 4px;
    display: inline-block;
  }

  @media (max-width: 600px) {
    .modal-info-grid { grid-template-columns: 1fr; }
    .header-logo { font-size: 12px; }
    .charts-section { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="pixel-coins">🎮 👾 🕹️</div>
  <div class="header-logo">🎮 RETRO <span>VAULT</span></div>
  <div class="header-sub">▸ MI COLECCIÓN DE COLECCIONABLES ◂</div>
  <div class="pixel-border-h" style="margin-top:14px;"></div>
</header>

<!-- STATS BAR -->
<div class="stats-bar" id="statsBar"></div>

<!-- CHARTS -->
<div class="charts-section">
  <div class="chart-box">
    <div class="chart-title">▶ DISTRIBUCIÓN POR TIPO</div>
    <div class="donut-wrap">
      <svg id="donutChart" width="110" height="110" viewBox="0 0 110 110"></svg>
      <div class="donut-legend" id="donutLegend"></div>
    </div>
  </div>
  <div class="chart-box">
    <div class="chart-title">▶ TOP PLATAFORMAS (JUEGOS)</div>
    <div class="bar-chart" id="platformChart"></div>
  </div>
  <div class="chart-box">
    <div class="chart-title">▶ DISTRIBUCIÓN EDITORIALES (LIBROS)</div>
    <div class="bar-chart" id="editorialChart"></div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="BUSCAR COLECCIONABLE..." autocomplete="off">
  </div>
  <button class="filter-btn active all"    data-filter="all"     onclick="setFilter('all')">TODOS</button>
  <button class="filter-btn juego"          data-filter="juego"   onclick="setFilter('juego')">🕹 JUEGOS</button>
  <button class="filter-btn Consola"        data-filter="Consola" onclick="setFilter('Consola')">📺 CONSOLAS</button>
  <button class="filter-btn Libro"          data-filter="Libro"   onclick="setFilter('Libro')">📚 LIBROS</button>
  <button class="filter-btn otro"           data-filter="otro"    onclick="setFilter('otro')">📦 OTROS</button>
  <select id="platformFilter" onchange="render()">
    <option value="">TODAS LAS PLATAFORMAS</option>
  </select>
</div>

<div class="results-info" id="resultsInfo"></div>

<div class="grid-container" id="gridContainer"></div>

<footer class="footer">
  <span>RETRO VAULT</span> — Colección personal &nbsp;|&nbsp; Impulsado por IA 🤖 &nbsp;|&nbsp; <span>INSERT COIN TO CONTINUE</span>
</footer>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-tipo-bar" id="modalTipoBar"></div>
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModalBtn()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-info-grid" id="modalInfoGrid"></div>

// Normalize tipo
COLLECTION.forEach(item => {
  if (!item.tipo) {
    item.tipo = item.editorial ? 'Libro' : 'otro';
  }
  item.tipo = item.tipo.trim();
  if (item.tipo === 'juego') item.tipoKey = 'juego';
  else if (item.tipo === 'Consola') item.tipoKey = 'Consola';

// ===== STATE =====
let currentFilter = 'all';
let currentSearch = '';
let currentPlatform = '';
const loreCache = {};

// ===== STATS =====
function buildStats() {
  const total = COLLECTION.length;
  const juegos = COLLECTION.filter(i => i.tipoKey === 'juego').length;
  const consolas = COLLECTION.filter(i => i.tipoKey === 'Consola').length;
  const libros = COLLECTION.filter(i => i.tipoKey === 'Libro').length;
  const otros = COLLECTION.filter(i => i.tipoKey === 'otro').length;

  const sb = document.getElementById('statsBar');
  sb.innerHTML = `
    <div class="stat-chip total">🎮 TOTAL: ${total}</div>
    <div class="stat-chip juegos">🕹 JUEGOS: ${juegos} (${Math.round(juegos/total*100)}%)</div>
    <div class="stat-chip consolas">📺 CONSOLAS: ${consolas} (${Math.round(consolas/total*100)}%)</div>
    <div class="stat-chip libros">📚 LIBROS: ${libros} (${Math.round(libros/total*100)}%)</div>
    <div class="stat-chip otros">📦 OTROS: ${otros} (${Math.round(otros/total*100)}%)</div>
  `;
}

// ===== DONUT CHART =====
function buildDonut() {
  const counts = {juego: 0, Consola: 0, Libro: 0, otro: 0};
  COLLECTION.forEach(i => counts[i.tipoKey]++);
  const total = COLLECTION.length;
  const colors = { juego: '#00d4ff', Consola: '#ff6b35', Libro: '#a78bfa', otro: '#34d399' };
  const labels = { juego: 'JUEGOS', Consola: 'CONSOLAS', Libro: 'LIBROS', otro: 'OTROS' };
  const svg = document.getElementById('donutChart');
  const legend = document.getElementById('donutLegend');
  const cx = 55, cy = 55, r = 40, sw = 18;
  let startAngle = -Math.PI / 2;
  let paths = '';
  let legendHtml = '';

  Object.entries(counts).forEach(([key, val]) => {
    if (!val) return;
    const angle = (val / total) * Math.PI * 2;
    const endAngle = startAngle + angle;
    const x1 = cx + r * Math.cos(startAngle);
    const y1 = cy + r * Math.sin(startAngle);
    const x2 = cx + r * Math.cos(endAngle);
    const y2 = cy + r * Math.sin(endAngle);
    const large = angle > Math.PI ? 1 : 0;
    paths += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${colors[key]}" opacity="0.85"/>`;
    legendHtml += `<div class="legend-item"><div class="legend-dot" style="border-color:${colors[key]};background:${colors[key]}22"></div><span style="color:${colors[key]}">${labels[key]} ${val}</span></div>`;
    startAngle = endAngle;
  });

  svg.innerHTML = paths + `<circle cx="${cx}" cy="${cy}" r="${r-sw}" fill="#12121f"/>`;
  legend.innerHTML = legendHtml;
}

// ===== PLATFORM CHART =====
function buildPlatformChart() {
  const platCounts = {};
  COLLECTION.filter(i => i.tipoKey === 'juego' && i.plataforma).forEach(i => {
    const p = i.plataforma.trim();
    platCounts[p] = (platCounts[p] || 0) + 1;
  });
  const sorted = Object.entries(platCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const max = sorted[0][1];
  const colors = ['#00d4ff','#7c3aed','#ff6b35','#00ff9d','#fbbf24','#f472b6','#34d399','#60a5fa'];
  const el = document.getElementById('platformChart');
  el.innerHTML = sorted.map(([plat, cnt], i) => `
    <div class="bar-row">
      <div class="bar-label">${plat}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${cnt/max*100}%;background:${colors[i%colors.length]}"></div>
      </div>
      <div class="bar-count">${cnt}</div>
    </div>
  `).join('');
}

// ===== EDITORIAL CHART =====
function buildEditorialChart() {
  const edCounts = {};
  COLLECTION.filter(i => i.editorial).forEach(i => {
    edCounts[i.editorial] = (edCounts[i.editorial] || 0) + 1;
  });
  const sorted = Object.entries(edCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const max = sorted[0]?.[1] || 1;
  const colors = ['#a78bfa','#f472b6','#60a5fa','#34d399','#fbbf24','#ff6b35','#00d4ff','#7c3aed'];
  const el = document.getElementById('editorialChart');
  el.innerHTML = sorted.map(([ed, cnt], i) => `
    <div class="bar-row">
      <div class="bar-label">${ed}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${cnt/max*100}%;background:${colors[i%colors.length]}"></div>
      </div>
      <div class="bar-count">${cnt}</div>
    </div>
  `).join('');
}

// ===== PLATFORM FILTER OPTIONS =====
function buildPlatformOptions() {
  const plats = [...new Set(COLLECTION.filter(i => i.plataforma).map(i => i.plataforma.trim()))].sort();
  const sel = document.getElementById('platformFilter');
  plats.forEach(p => {
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    sel.appendChild(o);
  });
}

// ===== FILTER =====
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('active');
    if (b.dataset.filter === f) b.classList.add('active');
  });
  render();
}

function getFiltered() {
  return COLLECTION.filter(item => {
    const q = currentSearch.toLowerCase();
    const matchSearch = !q ||
      item.nombre.toLowerCase().includes(q) ||
      (item.plataforma||'').toLowerCase().includes(q) ||
      (item.editorial||'').toLowerCase().includes(q);
    const matchFilter = currentFilter === 'all' || item.tipoKey === currentFilter;
    const matchPlat = !currentPlatform || item.plataforma === currentPlatform;
    return matchSearch && matchFilter && matchPlat;
  });
}

// ===== TIPO EMOJI =====
function tipoEmoji(tipo) {
  if (tipo === 'juego') return '🕹';
  if (tipo === 'Consola') return '📺';
  if (tipo === 'Libro') return '📚';
  return '📦';
}

// ===== WIKIPEDIA URL =====
function wikiUrl(nombre) {
  return `https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(nombre)}`;
}
function wikiUrlEs(nombre) {
  return `https://es.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(nombre)}`;
}
function ytUrl(nombre) {
  return `https://www.youtube.com/results?search_query=${encodeURIComponent(nombre + ' review')}`;
}
function priceUrl(nombre) {
  return `https://www.pricecharting.com/search-products?q=${encodeURIComponent(nombre)}&type=videogame`;
}

// ===== RENDER CARDS =====
function render() {
  const filtered = getFiltered();
  const info = document.getElementById('resultsInfo');
  info.innerHTML = `<span>Mostrando <strong>${filtered.length}</strong> de ${COLLECTION.length} items</span><span>${filtered.length === 0 ? '¡No se encontraron resultados!' : ''}</span>`;

  const grid = document.getElementById('gridContainer');
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">👾</div><p>GAME OVER - NO HAY RESULTADOS</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(item => {
    const plat = item.plataforma ? `<div class="card-meta">📺 PLATAFORMA: <span>${item.plataforma}</span></div>` : '';
    const ed = item.editorial ? `<div class="card-meta">📖 EDITORIAL: <span>${item.editorial}</span></div>` : '';
    const priceLink = (item.tipoKey === 'juego' || item.tipoKey === 'Consola') ?
      `<a class="link-btn price" href="${priceUrl(item.nombre)}" target="_blank" rel="noopener">💰 PRECIO</a>` : '';
    return `
    <div class="card" onclick="openModal(${JSON.stringify(item.nombre).replace(/'/g,'&#39;')})">
      <div class="card-tipo-bar ${item.tipoKey}"></div>
      <div class="card-body">
        <div class="card-header">
          <div class="card-name">${item.nombre}</div>
          <div class="card-badge ${item.tipoKey}">${tipoEmoji(item.tipoKey)} ${item.tipo || 'OTRO'}</div>
        </div>
        ${plat}${ed}
        <div class="card-links">
          <a class="link-btn wiki" href="${wikiUrlEs(item.nombre)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📖 WIKI</a>
          <a class="link-btn yt" href="${ytUrl(item.nombre)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">▶ YT</a>
          ${priceLink}
          <button class="link-btn lore" onclick="event.stopPropagation();openModal('${item.nombre.replace(/'/g,"\\'")}')">✦ LORE</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ===== MODAL =====
let currentModalItem = null;

function openModal(nombre) {
  const item = COLLECTION.find(i => i.nombre === nombre);
  if (!item) return;
  currentModalItem = item;

  const tipoColors = { juego:'#00d4ff', Consola:'#ff6b35', Libro:'#a78bfa', otro:'#34d399' };
  document.getElementById('modalTipoBar').style.background = tipoColors[item.tipoKey] || '#888';
  document.getElementById('modalTitle').textContent = item.nombre;

  // Info grid
  const infoItems = [
    { label: 'TIPO', value: `${tipoEmoji(item.tipoKey)} ${item.tipo || 'OTRO'}` },
    { label: 'PLATAFORMA', value: item.plataforma || '—' },
    { label: 'EDITORIAL', value: item.editorial || '—' },
  ];
  document.getElementById('modalInfoGrid').innerHTML = infoItems.map(i => `
    <div class="info-block">
      <div class="info-block-label">${i.label}</div>
      <div class="info-block-value">${i.value}</div>
    </div>
  `).join('');

  // Links
  const priceLink = (item.tipoKey === 'juego' || item.tipoKey === 'Consola') ?
    `<a class="modal-link-btn price" href="${priceUrl(item.nombre)}" target="_blank" rel="noopener">💰 VER PRECIO EN PRICECHARTING</a>` : '';
  document.getElementById('modalLinks').innerHTML = `
    <a class="modal-link-btn wiki" href="${wikiUrlEs(item.nombre)}" target="_blank" rel="noopener">📖 WIKIPEDIA ES</a>
    <a class="modal-link-btn wiki" href="${wikiUrl(item.nombre)}" target="_blank" rel="noopener">📖 WIKIPEDIA EN</a>
    <a class="modal-link-btn yt" href="${ytUrl(item.nombre)}" target="_blank" rel="noopener">▶ YOUTUBE</a>
    ${priceLink}
  `;

  // Lore
  const loreEl = document.getElementById('loreContent');
  if (loreCache[nombre]) {
    loreEl.textContent = loreCache[nombre];
  } else {
    loreEl.innerHTML = '<div class="lore-loading">CARGANDO DATOS DE LORE...</div>';
    fetchLore(item, loreEl);
  }

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalBtn();
}
function closeModalBtn() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalBtn(); });

// ===== FETCH LORE FROM CLAUDE API =====
async function fetchLore(item, el) {
  const tipoLabel = item.tipoKey === 'juego' ? 'videojuego' :
                    item.tipoKey === 'Consola' ? 'consola de videojuegos' :
                    item.tipoKey === 'Libro' ? 'libro' : 'coleccionable';
  const extra = item.plataforma ? ` para ${item.plataforma}` : '';
  const editExtra = item.editorial ? ` (editorial: ${item.editorial})` : '';

  const prompt = `Eres un experto en cultura pop, videojuegos, consolas y libros. Proporciona una ficha de lore/datos en español sobre "${item.nombre}", que es un ${tipoLabel}${extra}${editExtra}.

Incluye en formato compacto y ameno (usa líneas cortas, no markdown, no asteriscos):
- AÑO DE LANZAMIENTO: (año de lanzamiento o publicación original)
- DESARROLLADOR/AUTOR: (quien lo creó)
- GÉNERO: (género o categoría)
- DATO CURIOSIDAD 1: (algo interesante o poco conocido)
- DATO CURIOSIDAD 2: (otra curiosidad)
- RESUMEN: (2-3 oraciones sobre qué es y por qué es especial)

Sé preciso. Si no conoces exactamente la info, indica "Aprox." o da el dato más cercano. Usa un tono divertido y retro-gamer.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    if (data.content && data.content[0]) {
      const text = data.content[0].text;
      loreCache[item.nombre] = text;
      el.textContent = text;
    } else {
      el.innerHTML = '<div class="lore-error">⚠ No se pudo cargar el lore. Intenta de nuevo.</div>';
    }
  } catch (err) {
    el.innerHTML = '<div class="lore-error">⚠ Error de conexión al cargar el lore.</div>';
  }
}

// ===== INIT =====
buildStats();
buildDonut();
buildPlatformChart();
buildEditorialChart();
buildPlatformOptions();

document.getElementById('searchInput').addEventListener('input', e => {
  currentSearch = e.target.value;
  render();
});
document.getElementById('platformFilter').addEventListener('change', e => {
  currentPlatform = e.target.value;
  render();
});

render();
</script>
